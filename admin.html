<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>診断</title>
<style>
body{margin:0;padding:20px;background:#0b0b0d;color:#f2ece1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px}
input{width:100%;font-size:17px;padding:14px;border-radius:12px;
border:1px solid #2a2a2e;background:#151518;color:#fff;margin-bottom:12px}
button{width:100%;font-size:17px;font-weight:700;padding:16px;border:none;
border-radius:12px;color:#0b0b0d;background:#d4a556}
pre{white-space:pre-wrap;word-break:break-all;background:#151518;
border:1px solid #2a2a2e;border-radius:12px;padding:14px;margin-top:18px;
font-size:13px;line-height:1.6;color:#e2c9a4}
</style></head>
<body>
<input type="email" id="em" value="sekiya.nft@gmail.com" autocapitalize="none">
<input type="text" id="pw" value="Kintai2026bar" autocapitalize="none">
<button id="go">ログイン診断</button>
<pre id="out">ここに結果が出ます</pre>
<script>
document.getElementById('go').onclick = async function () {
  var out = document.getElementById('out');
  out.textContent = '通信中...';
  var url = 'https://xloffcmacznuhllhendx.supabase.co/auth/v1/token?grant_type=password';
  var key = 'sb_publishable_ApQmKKzTizl3EbFPpcJ15w_685w7d-8';
  try {
    var r = await fetch(url, {
      method: 'POST',
      headers: { 'apikey': key, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('em').value.trim(),
        password: document.getElementById('pw').value
      })
    });
    var t = await r.text();
    out.textContent = 'HTTP ' + r.status + '\n\n' + t.slice(0, 800);
  } catch (e) {
    out.textContent = '通信エラー: ' + e;
  }
};
</script></body></html>
