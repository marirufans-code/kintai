<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0d">
<title>管理画面</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0c0d;color:#e9eceb;min-height:100dvh;padding:20px;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:15px;letter-spacing:.2em;color:#8a8f8c;font-weight:500;text-align:center;margin:8px 0 20px}
h2{font-size:13px;letter-spacing:.14em;color:#e0b13f;font-weight:600;margin:26px 0 12px;
border-bottom:1px solid #262b29;padding-bottom:8px}
label{display:block;font-size:14px;color:#9ba39f;margin:14px 0 8px}
input{width:100%;font-size:17px;padding:15px;border-radius:12px;
border:1px solid #262b29;background:#131615;color:#fff}
input:focus{outline:none;border-color:#e0b13f}
button{font-size:17px;font-weight:700;padding:17px;border:none;border-radius:13px;
margin-top:16px;color:#1a1204;background:#e0b13f;width:100%}
button.sub{background:#161a19;color:#a6afab;border:1px solid #2c322f;
font-size:12px;padding:9px 13px;width:auto;margin:0}
button.out{background:#1e100e;color:#d05a4e;border:1px solid #4c2320}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.nav a{font-size:13px;color:#a6afab;background:#161a19;border:1px solid #2c322f;
border-radius:9px;padding:9px 14px;text-decoration:none}
.nav a.on{background:#e0b13f;color:#1a1204;border-color:#e0b13f}
.row{background:#131615;border:1px solid #262b29;border-radius:13px;
padding:15px 16px;margin-bottom:9px}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font-size:18px;font-weight:600}
.tm{font-size:17px;color:#e0b13f;font-variant-numeric:tabular-nums}
.dur{font-size:13px;color:#7b8380;margin-top:5px}
.tag{font-size:11px;color:#c98b6b;border:1px solid #5c3a2a;border-radius:5px;
padding:2px 6px;margin-left:7px;vertical-align:2px}
.pics{display:flex;gap:9px;margin-top:12px}
.pics div{flex:1}
.pics span{font-size:11px;color:#7b8380;display:block;margin-bottom:5px}
.pics img{width:100%;border-radius:9px;display:block;background:#1c211f}
.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.empty{color:#5f6764;font-size:14px;padding:6px 2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.st{font-size:11px;color:#5f6764}
.err{color:#ef8272;font-size:14px;margin-top:12px;text-align:center;line-height:1.6}
.hide{display:none}
</style></head>
<body><div class="wrap">

<div id="v-login">
<h1>管理画面</h1>
<label>メールアドレス</label>
<input type="email" id="em" autocomplete="username" autocapitalize="none" spellcheck="false">
<label>パスワード</label>
<input type="password" id="pw" autocomplete="current-password">
<button id="login">ログイン</button>
<div class="err" id="e1"></div>
</div>

<div id="v-main" class="hide">
<h1 id="store">管理画面</h1>
<div class="nav">
<a href="./admin.html" class="on">本日</a>
<a href="./history.html">履歴</a>
<a href="./staff.html">スタッフ</a>
<a href="./qr.html">QR</a>
</div>
<div class="bar">
<span class="st" id="st"></span>
<button class="sub" id="logout">ログアウト</button>
</div>
<h2>現在出勤中</h2>
<div id="working"></div>
<h2>退勤済</h2>
<div id="done"></div>
</div>

</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sb = createClient(
  'https://xloffcmacznuhllhendx.supabase.co',
  'sb_publishable_ApQmKKzTizl3EbFPpcJ15w_685w7d-8'
);

const $ = (i) => document.getElementById(i);
const open = new Set();

function bizDate() {
  const d = new Date(Date.now() - 8 * 3600 * 1000);
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(d);
}
function hm(ts) {
  return new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false
  }).format(new Date(ts));
}
function ymdhm(ts) {
  const p = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).format(new Date(ts));
  return p.slice(0, 16);
}
function dur(a, b) {
  const s = Math.floor((new Date(b) - new Date(a)) / 1000);
  return Math.floor(s / 3600) + '時間' + Math.floor((s % 3600) / 60) + '分';
}

$('login').onclick = async () => {
  $('e1').textContent = '';
  $('login').disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $('em').value.trim().toLowerCase(), password: $('pw').value
    });
    if (error) { $('e1').textContent = error.message; return; }
    await start();
  } finally { $('login').disabled = false; }
};

$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start() {
  $('v-login').classList.add('hide');
  $('v-main').classList.remove('hide');
  const { data: s } = await sb.from('stores').select('name').limit(1).maybeSingle();
  if (s) $('store').textContent = s.name;
  await load();
  sb.channel('att')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'attendances' }, load)
    .subscribe();
  setInterval(load, 15000);
}

async function pic(path) {
  if (!path) return null;
  const { data } = await sb.storage.from('attendance-photos').createSignedUrl(path, 300);
  return data ? data.signedUrl : null;
}

async function fix(r, field) {
  const cur = field === 'clock_in_at' ? r.clock_in_at : r.clock_out_at;
  const label = field === 'clock_in_at' ? '出勤時刻' : '退勤時刻';
  const def = cur ? ymdhm(cur) : ymdhm(new Date());
  const v = prompt(label + 'を修正（YYYY-MM-DD HH:MM）', def.replace('T', ' '));
  if (!v) return;
  const reason = prompt('修正理由（任意）', '') ?? '';
  const { data, error } = await sb.rpc('admin_fix_time', {
    p_attendance: r.id, p_field: field,
    p_new: v.trim().replace('T', ' '), p_reason: reason
  });
  if (error) { alert(error.message); return; }
  if (data && data.error) {
    alert({ forbidden: '権限がありません', order: '出勤より後の時刻にしてください',
      not_found: '記録が見つかりません' }[data.error] || data.error);
    return;
  }
  load();
}

async function load() {
  const { data, error } = await sb.from('attendances')
    .select('*').eq('business_date', bizDate()).order('clock_in_at');
  if (error) { $('st').textContent = 'エラー: ' + error.message; return; }

  const w = data.filter((r) => r.status === 'working');
  const d = data.filter((r) => r.status !== 'working');

  $('st').textContent = '更新 ' + hm(new Date()) + '　出勤中 ' + w.length + '名';
  $('working').innerHTML = w.length ? '' : '<div class="empty">誰も出勤していません</div>';
  $('done').innerHTML = d.length ? '' : '<div class="empty">まだありません</div>';

  for (const r of w) $('working').appendChild(card(r));
  for (const r of d) $('done').appendChild(card(r));
}

function card(r) {
  const el = document.createElement('div');
  el.className = 'row';
  const tag = r.staff_id ? '' : '<span class="tag">未登録</span>';
  const t = r.clock_out_at ? hm(r.clock_in_at) + ' → ' + hm(r.clock_out_at) : hm(r.clock_in_at);
  const sub = r.clock_out_at
    ? '<div class="dur">勤務時間 ' + dur(r.clock_in_at, r.clock_out_at) + '</div>' : '';

  el.innerHTML = '<div class="top"><span class="nm">' + esc(r.staff_name) + tag +
    '</span><span class="tm">' + t + '</span></div>' + sub +
    '<div class="pics hide"></div><div class="acts hide"></div>';

  const pics = el.querySelector('.pics');
  const acts = el.querySelector('.acts');

  if (!r.clock_out_at) {
    const b = document.createElement('button');
    b.className = 'sub out';
    b.textContent = '強制退勤';
    b.onclick = async (ev) => {
      ev.stopPropagation();
      const v = prompt(r.staff_name + ' の退勤時刻（YYYY-MM-DD HH:MM）',
        ymdhm(new Date()).replace('T', ' '));
      if (!v) return;
      const reason = prompt('理由（任意）', '退勤忘れ') ?? '';
      const { data, error } = await sb.rpc('admin_fix_time', {
        p_attendance: r.id, p_field: 'clock_out_at',
        p_new: v.trim().replace('T', ' '), p_reason: reason
      });
      if (error) { alert(error.message); return; }
      if (data && data.error) { alert(data.error === 'order' ? '出勤より後の時刻にしてください' : data.error); return; }
      load();
    };
    acts.appendChild(b);
  }

  const bi = document.createElement('button');
  bi.className = 'sub';
  bi.textContent = '出勤時刻を修正';
  bi.onclick = (ev) => { ev.stopPropagation(); fix(r, 'clock_in_at'); };
  acts.appendChild(bi);

  if (r.clock_out_at) {
    const bo = document.createElement('button');
    bo.className = 'sub';
    bo.textContent = '退勤時刻を修正';
    bo.onclick = (ev) => { ev.stopPropagation(); fix(r, 'clock_out_at'); };
    acts.appendChild(bo);
  }

  el.onclick = async () => {
    if (open.has(r.id)) {
      open.delete(r.id); pics.classList.add('hide'); acts.classList.add('hide'); return;
    }
    open.add(r.id);
    pics.classList.remove('hide'); acts.classList.remove('hide');
    pics.innerHTML = '<div class="empty">読み込み中...</div>';
    const [a, b] = await Promise.all([pic(r.clock_in_photo_path), pic(r.clock_out_photo_path)]);
    pics.innerHTML =
      '<div><span>出勤時</span>' + (a ? '<img src="' + a + '">' : '<div class="empty">なし</div>') + '</div>' +
      '<div><span>退勤時</span>' + (b ? '<img src="' + b + '">' : '<div class="empty">なし</div>') + '</div>';
  };
  return el;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script></body></html>
