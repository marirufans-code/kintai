<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>勤務履歴</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0b0d;color:#f2ece1;min-height:100dvh;padding:20px;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:15px;letter-spacing:.2em;color:#8a8578;font-weight:500;text-align:center;margin:8px 0 20px}
h2{font-size:13px;letter-spacing:.14em;color:#d4a556;font-weight:600;margin:26px 0 12px;
border-bottom:1px solid #26262b;padding-bottom:8px}
label{display:block;font-size:13px;color:#a9a396;margin:12px 0 6px}
input,select{width:100%;font-size:16px;padding:13px;border-radius:11px;
border:1px solid #2a2a2e;background:#151518;color:#fff}
input:focus,select:focus{outline:none;border-color:#d4a556}
.f2{display:flex;gap:10px}.f2>div{flex:1}
button{font-size:16px;font-weight:700;padding:15px;border:none;border-radius:12px;
margin-top:14px;color:#0b0b0d;background:#d4a556;width:100%}
button.sub{background:#1e1e22;color:#c9c3b7;border:1px solid #33333a;
font-size:13px;padding:9px 14px;width:auto;margin:0}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.nav a{font-size:13px;color:#c9c3b7;background:#1e1e22;border:1px solid #33333a;
border-radius:9px;padding:9px 14px;text-decoration:none}
.nav a.on{background:#d4a556;color:#0b0b0d;border-color:#d4a556}
.row{background:#141417;border:1px solid #26262b;border-radius:12px;
padding:14px 15px;margin-bottom:8px}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font-size:17px;font-weight:600}
.tm{font-size:16px;color:#d4a556;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:#7d786f;margin-top:5px}
.dt{font-size:12px;color:#8a8578;margin-bottom:3px}
.pics{display:flex;gap:9px;margin-top:11px}
.pics div{flex:1}
.pics span{font-size:11px;color:#7d786f;display:block;margin-bottom:5px}
.pics img{width:100%;border-radius:9px;display:block;background:#1e1e22}
.sum{display:flex;justify-content:space-between;padding:13px 15px;
background:#141417;border:1px solid #26262b;border-radius:12px;margin-bottom:8px}
.sum .h{font-size:16px;font-weight:600}
.sum .v{text-align:right}
.sum .v b{font-size:17px;color:#d4a556;font-variant-numeric:tabular-nums}
.sum .v small{display:block;font-size:11px;color:#7d786f;margin-top:3px}
.empty{color:#5e5a53;font-size:14px;padding:8px 2px}
.err{color:#f0806f;font-size:14px;margin-top:12px;text-align:center}
.hide{display:none}
</style></head>
<body><div class="wrap">

<div id="v-login">
<h1>勤務履歴</h1>
<label>メールアドレス</label>
<input type="email" id="em" autocapitalize="none" spellcheck="false">
<label>パスワード</label>
<input type="password" id="pw">
<button id="login">ログイン</button>
<div class="err" id="e1"></div>
</div>

<div id="v-main" class="hide">
<h1 id="store">勤務履歴</h1>
<div class="nav">
<a href="./admin.html">本日</a>
<a href="./history.html" class="on">履歴</a>
<a href="./qr.html">QR</a>
</div>

<h2>絞り込み</h2>
<div class="f2">
<div><label>開始日</label><input type="date" id="from"></div>
<div><label>終了日</label><input type="date" id="to"></div>
</div>
<label>スタッフ名（部分一致・空欄で全員）</label>
<input type="text" id="q" autocapitalize="none">
<button id="search">検索</button>

<h2>集計</h2>
<div id="summary"></div>

<h2>明細 <span id="cnt" style="color:#5e5a53;font-size:11px"></span></h2>
<div id="list"></div>
</div>

</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sb = createClient(
  'https://xloffcmacznuhllhendx.supabase.co',
  'sb_publishable_ApQmKKzTizl3EbFPpcJ15w_685w7d-8'
);

const $ = (i) => document.getElementById(i);
const open = new Set();
let wages = {};

function hm(ts) {
  return new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false
  }).format(new Date(ts));
}
function secs(a, b) { return Math.floor((new Date(b) - new Date(a)) / 1000); }
function hhmm(s) { return Math.floor(s / 3600) + '時間' + Math.floor((s % 3600) / 60) + '分'; }
function yen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function md(d) {
  const [y, m, dd] = d.split('-');
  return Number(m) + '/' + Number(dd);
}

$('login').onclick = async () => {
  $('e1').textContent = '';
  $('login').disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $('em').value.trim().toLowerCase(), password: $('pw').value
  });
  $('login').disabled = false;
  if (error) { $('e1').textContent = error.message; return; }
  start();
};

async function start() {
  $('v-login').classList.add('hide');
  $('v-main').classList.remove('hide');

  const { data: s } = await sb.from('stores').select('name').limit(1).maybeSingle();
  if (s) $('store').textContent = s.name;

  const { data: st } = await sb.from('staff').select('name_key,hourly_wage');
  if (st) for (const r of st) wages[r.name_key] = r.hourly_wage;

  const now = new Date();
  const j = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(now);
  const [y, m] = j.split('-');
  $('from').value = y + '-' + m + '-01';
  $('to').value = j;
  await run();
}

$('search').onclick = run;

async function run() {
  $('summary').innerHTML = '<div class="empty">読み込み中...</div>';
  $('list').innerHTML = '';

  let q = sb.from('attendances').select('*')
    .gte('business_date', $('from').value)
    .lte('business_date', $('to').value)
    .order('business_date', { ascending: false })
    .order('clock_in_at', { ascending: false });

  const kw = $('q').value.trim();
  if (kw) q = q.ilike('staff_name', '%' + kw + '%');

  const { data, error } = await q;
  if (error) { $('summary').innerHTML = '<div class="err">' + error.message + '</div>'; return; }

  const agg = {};
  for (const r of data) {
    const k = r.name_key;
    if (!agg[k]) agg[k] = { name: r.staff_name, days: 0, sec: 0, openCount: 0 };
    agg[k].days++;
    if (r.clock_out_at) agg[k].sec += secs(r.clock_in_at, r.clock_out_at);
    else agg[k].openCount++;
  }

  const keys = Object.keys(agg);
  $('summary').innerHTML = keys.length ? '' : '<div class="empty">該当なし</div>';
  for (const k of keys.sort((a, b) => agg[b].sec - agg[a].sec)) {
    const a = agg[k];
    const w = wages[k];
    const pay = w ? '<small>' + yen(a.sec / 3600 * w) + '（時給' + w + '円）</small>' : '';
    const warn = a.openCount ? '<small style="color:#c98b6b">未退勤 ' + a.openCount + '件</small>' : '';
    const el = document.createElement('div');
    el.className = 'sum';
    el.innerHTML = '<div><div class="h">' + esc(a.name) + '</div>' +
      '<small style="color:#7d786f">' + a.days + '日</small></div>' +
      '<div class="v"><b>' + hhmm(a.sec) + '</b>' + pay + warn + '</div>';
    $('summary').appendChild(el);
  }

  $('cnt').textContent = data.length + '件';
  $('list').innerHTML = data.length ? '' : '<div class="empty">該当なし</div>';
  for (const r of data) $('list').appendChild(card(r));
}

async function pic(path) {
  if (!path) return null;
  const { data } = await sb.storage.from('attendance-photos').createSignedUrl(path, 300);
  return data ? data.signedUrl : null;
}

function card(r) {
  const el = document.createElement('div');
  el.className = 'row';
  const t = r.clock_out_at
    ? hm(r.clock_in_at) + ' → ' + hm(r.clock_out_at)
    : hm(r.clock_in_at) + ' → —';
  const d = r.clock_out_at
    ? hhmm(secs(r.clock_in_at, r.clock_out_at))
    : '<span style="color:#c98b6b">退勤記録なし</span>';
  el.innerHTML = '<div class="dt">' + md(r.business_date) + '</div>' +
    '<div class="top"><span class="nm">' + esc(r.staff_name) + '</span>' +
    '<span class="tm">' + t + '</span></div>' +
    '<div class="meta">' + d + '</div><div class="pics hide"></div>';

  el.onclick = async () => {
    const box = el.querySelector('.pics');
    if (open.has(r.id)) { open.delete(r.id); box.classList.add('hide'); return; }
    open.add(r.id);
    box.classList.remove('hide');
    box.innerHTML = '<div class="empty">読み込み中...</div>';
    const [a, b] = await Promise.all([pic(r.clock_in_photo_path), pic(r.clock_out_photo_path)]);
    box.innerHTML =
      '<div><span>出勤時</span>' + (a ? '<img src="' + a + '">' : '<div class="empty">なし</div>') + '</div>' +
      '<div><span>退勤時</span>' + (b ? '<img src="' + b + '">' : '<div class="empty">なし</div>') + '</div>';
  };
  return el;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script></body></html>
